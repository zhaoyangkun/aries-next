          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: 用户名、邮箱、显示名或密码不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: bootstrap_secret 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 系统已初始化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/bootstrap/status:
    get:
      tags:
      - Admin Auth
      summary: 查询系统初始化状态
      description: 返回是否已创建首个 User；未初始化时前端应引导进入 Bootstrap 流程。
      operationId: bootstrapStatus
      responses:
        '200':
          description: 是否已创建首个 User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '500':
          description: 数据库查询失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
