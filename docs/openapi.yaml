      responses:
        '200':
          description: 公开照片墙列表。
          headers:
            Cache-Control:
              schema: { type: string }
              examples: ['public, max-age=60, stale-while-revalidate=300']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPhoto'
  /api/public/articles/{slug}/comments:
    get:
      tags: [Public Comments]
      operationId: listPublicArticleComments
      description: 匿名可访问；只返回已发布文章的 `approved` 评论，组织为两级树（根评论的 `children` 为回复，回复下的回复平铺在同一根下）。分页只作用于根评论，回复整组跟随所属根；根评论按创建时间升序。文章不存在或未发布返回 404 `ARTICLE_NOT_FOUND`；`page > 1` 且当前页无根评论时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200）。
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: 缺省时取站点设置 `comments_per_page`。
      responses:
        '200':
          description: 已批准评论树分页。
          headers:
            Cache-Control:
              schema: { type: string }
              examples: ['public, max-age=60, stale-while-revalidate=300']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/pages/{slug}/comments:
    get:
      tags: [Public Comments]
      operationId: listPublicPageComments
      description: 匿名可访问；与 `listPublicArticleComments` 同语义，目标为已发布页面（Page）。页面不存在或未发布返回 404；`page > 1` 且当前页无根评论时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200）。
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
          description: 缺省时取站点设置 `comments_per_page`。
      responses:
        '200':
          description: 已批准评论树分页。
          headers:
            Cache-Control:
              schema: { type: string }
              examples: ['public, max-age=60, stale-while-revalidate=300']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/comments:
    post:
      tags: [Public Comments]
      operationId: createPublicComment
      description: 访客发表评论。目标只允许已发布文章（`article`）或已发布页面（`page`），按 `target_slug` 定位。初始状态由站点评论策略决定：`moderated` → `pending`、`auto_approve` → `approved`、`closed` → 403 `COMMENTS_CLOSED`。Markdown 由服务端渲染并 Sanitize；Email/IP/UA 只存 Hash，不出现在任何响应中。同一客户端 60 秒最多 3 条（429 `RATE_LIMITED`）；相同 Email + 目标 + 内容 5 分钟内重复提交返回 409 `COMMENT_DUPLICATE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicCommentRequest'
      responses:
        '200':
          description: 创建成功；`status` 供前端提示「待审核」。响应禁止缓存（no-store）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/comments/{id}/replies:
    post:
      tags: [Public Comments]
      operationId: replyPublicComment
      description: 回复某条评论；只允许回复 `approved` 状态的评论，其余一律 404 `COMMENT_NOT_FOUND`（不泄露未审核评论的存在）。回复回复时新评论挂到同一根下，保持两级展示。校验、限流与策略规则同 `POST /api/public/comments`。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyPublicCommentRequest'
      responses:
        '200':
          description: 创建成功；`status` 供前端提示「待审核」。响应禁止缓存（no-store）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/navigation:
    get:
      tags: [Public Extended]
      operationId: listPublicNavigation
      description: 匿名可访问；只返回 `visible = true` 的节点，组织为两级树（一级节点的 `children` 为其子菜单）。隐藏节点不出现在响应中。
      responses:
        '200':
          description: 公开导航两级树。
          headers:
            Cache-Control:
              schema: { type: string }
              examples: ['public, max-age=60, stale-while-revalidate=300']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicNavigationNode'
  /api/admin/media:
    get:
      tags: [Admin Media]
      operationId: listAdminMedia
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: keyword
          in: query
          description: 按 `original_name` 模糊匹配。
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string, enum: [local, s3, legacy_url] }
        - name: mime
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 仅返回 `active` 资产；稳定排序 `created_at DESC, id DESC`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Media]
      operationId: uploadAdminMedia
      description: Multipart 字段名 `file[]`，每批 1–5 个文件，单文件 ≤ 5MB；扩展名白名单 jpg/jpeg/png/gif/bmp/webp，并校验 Magic Bytes 与声明 MIME。响应恒为数组。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
