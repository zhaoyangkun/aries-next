          description: 级别原文（`ERROR`/`WARN`/`INFO`/`DEBUG`/`TRACE`）；不做枚举约束，未来新增级别无需改表。
          type: string
        target:
          description: tracing target（模块路径）。
          type: string
        message: { type: string }
