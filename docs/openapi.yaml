      summary: 搜索建议（输入即搜下拉）
      description: 标题/摘要包含匹配，标题前缀命中优先，按发布时间倒序取前 `limit` 条，只命中 Published。响应不可缓存。
      operationId: searchSuggest
      parameters:
      - name: q
        in: path
        description: 搜索关键词，1–100 字符。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: path
        description: 返回条数上限（1–20，默认 8）。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: 建议列表（可能为空数组）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchSuggestionResponse'
        '400':
          description: 关键词为空或过长（`INVALID_SEARCH_KEYWORD`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/site:
    get:
      tags:
      - Public Site
      summary: 公开站点信息
      description: site_settings 的公开投影；只含站点名称、描述、URL、Logo、ICP 备案号与默认封面，绝不返回任何内部配置。可匿名访问并带 CDN 缓存头。
      operationId: getPublicSite
      responses:
        '200':
          description: 公开站点信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteResponse'
  /api/public/tags:
    get:
      tags:
      - Public Taxonomy
      summary: 获取公开标签列表
      description: 标签列表，含实时 Published 文章数。
      operationId: listPublicTags
      responses:
        '200':
          description: 标签摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTagResponse'
  /api/public/tags/{slug}/articles:
    get:
      tags:
      - Public Taxonomy
      summary: 获取标签下的公开文章分页
      description: 该标签下 Published 文章分页；分页大小取站点设置 `page_size_index`。`page > 1` 且当前页结果为空时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200）。
      operationId: listTagArticles
      parameters:
      - name: slug
        in: path
        description: 标签 Slug
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 页码，从 1 开始。
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: 分页文章列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePageResponse'
        '404':
          description: 标签不存在（`TAG_NOT_FOUND`）或页码越界（`PAGE_OUT_OF_RANGE`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AiModelsResponse:
      type: object
      title: AiModelsResponse
      description: Provider 返回的模型 ID 列表（去重排序，上限 500）。
      required:
      - models
      properties:
        models:
          type: array
          items:
            type: string
    AiUsageItem:
      type: object
      description: AI 请求审计记录；不存完整 Prompt。
      required:
      - id
      - feature
      - model
      - status
      - latency_ms
      - created_at
      properties:
        completion_tokens:
          type:
          - integer
          - 'null'
          format: int32
          description: 补全 Token 用量；失败或无用量报告时为 null。
        created_at:
          type: string
          format: date-time
        error_category:
          type:
          - string
          - 'null'
          description: 失败分类（config/provider/timeout/rate_limited/invalid_output/store）。
        feature:
          type: string
          description: 功能标识，同查询参数 `feature` 的枚举值。
        id:
          type: integer
          format: int64
        latency_ms:
          type: integer
          format: int32
          description: 端到端耗时（毫秒）。
        model:
          type: string
          description: 使用的模型 ID。
        operator_user_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 触发用户；null 表示系统触发（评论自动审核）。
        prompt_tokens:
          type:
          - integer
          - 'null'
          format: int32
          description: Prompt Token 用量；失败或无用量报告时为 null。
        status:
          type: string
          description: '`success` / `failed` / `cancelled`。'
    AiUsagePageResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiUsageItem'
          description: 用量审计记录列表。
        page:
          type: integer
          format: int32
          description: 当前页码。
          minimum: 0
        page_size:
          type: integer
          format: int32
          description: 每页条数。
          minimum: 0
        total:
          type: integer
          format: int64
          description: 符合条件的总记录数。
    ArchiveArticleResponse:
      type: object
      required:
      - slug
      - title
      - published_at
      properties:
        published_at:
          type: string
          format: date-time
        slug:
          type: string
        title:
          type: string
    ArchiveMonthResponse:
      type: object
      required:
      - year
      - month
      - count
      - articles
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveArticleResponse'
        count:
          type: integer
          format: int64
        month:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
    ArticlePageResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArticleResponse'
          description: 当前页文章列表。
        page:
          type: integer
          format: int32
          description: 当前页码，从 1 开始。
          minimum: 0
        page_size:
          type: integer
          format: int32
          description: 每页条数。
          minimum: 0
        total:
          type: integer
          format: int64
          description: 命中总数（稳定 Total 语义，与分页无关）。
    ArticleResponse:
      type: object
      required:
      - id
      - author_id
      - status
      - slug
      - title
      - summary
      - markdown_source
      - rendered_html
      - seo_keywords
      - tag_ids
      - password_protected
      - allow_comments
      - is_pinned
      - version
      - created_at
      - updated_at
      properties:
        ai_brief:
          type:
          - string
          - 'null'
          description: AI 导读（TL;DR）；更新时字段缺省表示不改动，显式 null 清除。
        allow_comments:
          type: boolean
          description: 是否允许评论。
        author_id:
          type: integer
          format: int64
          description: 作者用户 ID。
        category_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 所属分类 ID。
        cover_url:
          type:
          - string
          - 'null'
          description: 封面图 URL。
        created_at:
          type: string
          format: date-time
          description: 创建时间（RFC 3339）。
        id:
          type: integer
          format: int64
          description: 文章 ID。
        is_pinned:
          type: boolean
          description: 是否置顶。
        markdown_source:
          type: string
          description: Markdown 原文。
        password_protected:
          type: boolean
          description: 是否设置了访问密码（任何响应都不回显密码或哈希）。
        published_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 发布时间；草稿为 `null`。
        rendered_html:
          type: string
          description: 服务端渲染并 Sanitization 后的 HTML。
        seo_keywords:
          type: array
          items:
            type: string
          description: SEO 关键字列表。
        slug:
          type: string
          description: URL 别名。
        status:
          type: string
          description: 文章状态：`draft` / `published` / `recycled`。
          example: published
        summary:
          type: string
          description: 摘要。
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 关联标签 ID 列表。
        title:
          type: string
          description: 文章标题。
        updated_at:
          type: string
          format: date-time
          description: 更新时间（RFC 3339）。
        version:
          type: integer
          format: int64
          description: 乐观锁版本号：每次更新递增。
    ArticleStats:
      type: object
      title: ArticleStats
      description: 文章计数统计。
      required:
      - total
      - draft
      - published
      - recycled
      properties:
        draft:
          type: integer
          format: int64
          description: 草稿数。
        published:
          type: integer
          format: int64
          description: 已发布数。
        recycled:
          type: integer
          format: int64
          description: 回收站数。
        total:
          type: integer
          format: int64
          description: 全部文章数（不含软删除）。
    ArticleStatusCommand:
      type: string
      enum:
      - publish
      - recycle
      - recover
    ArticleViewResponse:
      type: object
      description: 浏览计数响应。
      required:
      - visit_count
      properties:
        visit_count:
          type: integer
          format: int64
          description: 当前浏览量。
    AskRequest:
      type: object
      required:
      - question
      properties:
        question:
          type: string
          description: 用户问题，1–300 字符。
    AuditLogResponse:
      type: object
      title: AuditLogEntry
      description: 单条审计日志记录。
      required:
      - id
      - action
      - target_type
      - metadata
      - created_at
      properties:
        action:
          type: string
        actor_user_id:
          type:
          - integer
          - 'null'
          format: int64
        actor_username:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        metadata: {}
        target_id:
          type:
          - string
          - 'null'
        target_type:
          type: string
    AuditPageResponse:
      type: object
      title: AuditPageResponse
      description: 审计日志分页。
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
    BatchDeleteMediaRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          description: 待删除的资产 ID 列表，单次 1–100 个（服务端去重）。
    BatchDeleteMediaResponse:
      type: object
      description: 批量删除的部分成功结果；三个列表均按 ID 升序，且互不相交。
      required:
      - deleted
      - referenced
      - not_found
      properties:
        deleted:
          type: array
          items:
            type: integer
            format: int64
          description: 成功软删除的 ID。
        not_found:
          type: array
          items:
            type: integer
            format: int64
          description: 不存在或已删除的 ID。
        referenced:
          type: array
          items:
            type: integer
            format: int64
          description: 仍被内容引用、保持 active 的 ID。
    BootstrapRequest:
      type: object
      required:
      - bootstrap_secret
      - username
      - email
      - display_name
      - password
      properties:
        bootstrap_secret:
          type: string
          description: 一次性引导密钥（环境变量 BOOTSTRAP_SECRET，≥ 24 字符）。
        display_name:
          type: string
          description: 显示名：1–60 字符。
        email:
          type: string
          description: 邮箱地址。
        password:
          type: string
          description: 初始密码：10–128 字符。
        username:
          type: string
          description: 登录用户名：3–30 位字母、数字、下划线或短横线。
    BootstrapStatusResponse:
      type: object
      required:
      - initialized
      properties:
        initialized:
          type: boolean
          description: 是否已创建首个 User。
    CategoryPayload:
      type: object
      description: 友链分类创建/更新请求体。
      required:
      - name
      properties:
        name:
          type: string
        slug:
          type:
          - string
          - 'null'
          description: 缺省时取 `name`。
    CategoryResponse:
      type: object
      title: CategoryResponse
      description: 管理端分类 DTO；`/api/admin/categories` 固定 `kind = article`，link / gallery 分类由各自模块管理。
      required:
      - id
      - kind
      - name
      - slug
      - description
      properties:
        description:
          type: string
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: 分类类型（本模块固定为 `article`）。
        name:
          type: string
        parent_id:
          type:
          - integer
          - 'null'
          format: int64
        slug:
          type: string
    ChangeArticleStatusRequest:
      type: object
      required:
      - command
      - expected_version
      properties:
        command:
          $ref: '#/components/schemas/ArticleStatusCommand'
          description: 状态流转命令：`publish`（发布，draft → published）、`recycle`（回收）、`recover`（还原为草稿）。
        expected_version:
          type: integer
          format: int64
          description: 乐观锁版本号：必须等于当前 `version`，否则返回 409 `ARTICLE_CONFLICT`。
    ChangeCommentStatusRequest:
      type: object
      required:
      - status
      properties:
        reason:
          type:
          - string
          - 'null'
          description: 审核备注（可选，trim 后非空才持久化）。
        status:
          type: string
          description: 目标状态：`pending` / `approved` / `rejected` / `spam` / `recycled`。
    CommentPageResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        page_size:
          type: integer
          format: int32
          minimum: 0
        total:
          type: integer
          format: int64
          description: 当前筛选条件下的评论总数。
    CommentResponse:
      type: object
      description: 评论 DTO：不返回 `ip_hash`/`user_agent_digest` 等内部字段。
      required:
      - id
      - target_type
      - target_id
      - author_name
      - author_email
      - content_markdown
      - content_html
      - status
      - is_admin_reply
      - created_at
      - updated_at
      properties:
        ai_confidence:
          type:
          - number
          - 'null'
          format: float
          description: AI 置信度（0–1）。
        ai_reason:
          type:
          - string
          - 'null'
          description: AI 给出的简短理由。
        ai_risk:
          type:
          - string
          - 'null'
          description: AI 审核结论（未审核为 null），供管理端辅助判断。
        author_email:
          type: string
          description: 仅 Admin API 返回，Public API 永不暴露。
        author_name:
          type: string
        author_url:
          type:
          - string
          - 'null'
        content_html:
          type: string
          description: 服务端 Comrak 渲染并 Sanitize 后的 HTML，可安全直出。
        content_markdown:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        is_admin_reply:
          type: boolean
        moderated_at:
          type:
          - string
          - 'null'
          format: date-time
        moderation_reason:
          type:
          - string
          - 'null'
          description: 审核备注（状态变更时可选填写）。
        parent_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 直接父评论 ID；根评论为 null。
        root_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 所属根评论 ID（根评论为自身 ID）。
        status:
          type: string
          description: '`pending` / `approved` / `rejected` / `spam` / `recycled`。'
        target_id:
          type: integer
          format: int64
        target_type:
          type: string
          description: 评论目标类型：`article` / `page` / `link`。
        updated_at:
          type: string
          format: date-time
    CommentStats:
      type: object
      title: CommentStats
      description: 评论计数统计。
      required:
      - total
      - pending
      - today
      properties:
        pending:
          type: integer
          format: int64
          description: 待审核数。
        today:
          type: integer
          format: int64
          description: 今日新增数。
        total:
          type: integer
          format: int64
          description: 全部评论数。
    CommitImportRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommitStrategy'
          description: 仅冲突项需要显式策略；未列出的冲突项默认 skip。
    CommitResultResponse:
      type: object
      required:
      - created
      - skipped
      - renamed
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/CreatedArticleSummary'
        renamed:
          type: array
          items:
            $ref: '#/components/schemas/RenamedSlug'
          description: 因冲突自动改名的 Slug 映射。
        skipped:
          type: array
          items:
            type: string
          description: 因 Slug 冲突被跳过的 Slug。
    CommitStrategy:
      type: object
      required:
      - index
      - strategy
      properties:
        index:
          type: integer
          description: 导入预览项的序号。
          minimum: 0
        strategy:
          type: string
          description: '`skip`（跳过）或 `rename`（自动改名落库）。'
    CreateArticleRequest:
      type: object
      required:
      - title
      properties:
        access_password:
          type:
          - string
          - 'null'
          description: |-
            文章访问密码（明文，服务端以 Argon2id 哈希后存储，任何响应都不回显）。
            新建时字段缺省或显式 `null` 都视为无密码；字符串表示设置新密码，
            Trim 后少于 6 个字符返回 400 `INVALID_ACCESS_PASSWORD`。
        ai_brief:
          type:
          - string
          - 'null'
          description: AI 导读（TL;DR），由 `/api/admin/ai/editor/brief` 生成；不超过 500 字符。
        allow_comments:
          type: boolean
          description: 是否允许评论，默认 `true`。
        category_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 所属分类 ID。
        cover_url:
          type:
          - string
          - 'null'
          description: 封面图 URL。
        is_pinned:
          type: boolean
          description: 是否置顶，默认 `false`。
        markdown_source:
          type: string
          description: Markdown 原文，最长 1,000,000 字符。
        seo_keywords:
          type: array
          items:
            type: string
          description: SEO 关键字（Trim、排序、去重，最多 20 个，单个最长 50 字符）。
        slug:
          type:
          - string
          - 'null'
          description: URL 别名；缺省回退为标题。
        summary:
          type: string
          description: 摘要，最长 500 字符。
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 关联标签 ID 列表。
        title:
          type: string
          description: 文章标题（Trim 后非空，最长 200 字符）。
    CreateCommentRequest:
      type: object
      description: 访客发表评论；`target_type` 支持 `article` / `page`，按 `target_slug` 定位已发布目标。`website` 可选且仅允许 http/https。
      required:
      - target_type
      - target_slug
      - nickname
      - email
      - content
      properties:
        content:
          type: string
          description: Markdown 源文本，长度 1–2000 字符。
        email:
          type: string
          description: 邮箱（只入库不出 API），最大 254 字符。
        nickname:
          type: string
          description: 昵称，长度 1–60 字符。
        target_slug:
          type: string
          description: 已发布文章 / 页面的 Slug。
        target_type:
          type: string
          description: 评论目标类型；公开提交仅接受 `article` / `page`。
        website:
          type:
          - string
          - 'null'
          description: 个人主页，可选且仅允许 http/https。
    CreateTaxonomyRequest:
      type: object
      title: CreateTaxonomyRequest
      description: 创建/更新分类或标签的请求体。
      required:
      - name
      properties:
        name:
          type: string
          description: 显示名称；`slug` 缺省时以 name 归一化生成。
        slug:
          type:
          - string
          - 'null'
          description: 自定义 Slug；缺省时取 name。
    CreatedArticleSummary:
      type: object
      required:
      - id
      - title
      - slug
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
    DashboardResponse:
      type: object
      title: DashboardResponse
      description: Dashboard 聚合：文章/评论统计、最近待审核评论与最近失败的后台任务。
      required:
      - articles
      - comments
      - recent_pending_comments
      - recent_failed_jobs
      properties:
        articles:
          $ref: '#/components/schemas/ArticleStats'
        comments:
          $ref: '#/components/schemas/CommentStats'
        recent_failed_jobs:
          type: array
          items:
            $ref: '#/components/schemas/FailedJobResponse'
        recent_pending_comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 机器可读错误码，如 `UNAUTHORIZED`、`ARTICLE_NOT_FOUND`。
        details:
          description: 结构化补充信息（如引用计数），大多数错误为空，序列化时省略。
        message:
          type: string
          description: 人类可读错误信息。
    ErrorResponse:
      type: object
      description: |-
        统一错误响应体（与 `http::error::ApiError` 的实际 JSON 形状一致）：
        `{ "error": { "code", "message", "details?" } }`。
        所有端点的 4xx/5xx 响应统一引用本类型。
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    FailedJobResponse:
      type: object
      title: FailedJob
