openapi: 3.1.0
info:
  title: Aries Next API
  version: 0.1.0
  description: Aries Next API Contract。覆盖 Authentication、Content Publishing、Media Library、Public Web、Site Settings、Import、评论管理、Dashboard 聚合、Audit Log 查询、运行日志查询与 SQL 日志开关，以及扩展内容（Page、Journal、Gallery、Link、Navigation）与分组设置（appearance / email / integrations / ai）。
servers:
  - url: http://127.0.0.1:8088
paths:
  /api/health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      responses:
        '200':
          description: Process 正常运行。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        '200':
          description: PostgreSQL 可访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL 暂不可用。
  /api/admin/bootstrap/status:
    get:
      tags: [Admin Authentication]
      operationId: getBootstrapStatus
      responses:
        '200':
          description: 返回是否已创建首个 User。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/bootstrap:
    post:
      tags: [Admin Authentication]
      operationId: bootstrapOwner
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: 创建首个 Owner 并签发 Session Cookie。
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/admin/auth/login:
    post:
      tags: [Admin Authentication]
      operationId: loginAdmin
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication 成功并签发 Session Cookie。
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/admin/auth/logout:
    post:
      tags: [Admin Authentication]
      operationId: logoutAdmin
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 撤销当前 Session 并清除 Cookie。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/auth/session:
    get:
      tags: [Admin Authentication]
      operationId: getAdminSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 返回当前 Session 与 User View。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/admin/auth/password/forgot:
    post:
      tags: [Admin Authentication]
      operationId: requestPasswordReset
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: 无论账号是否存在都返回相同响应。Phase 05 接入 Email Adapter 前不会发送 Email。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/admin/auth/password/reset:
    post:
      tags: [Admin Authentication]
      operationId: resetPassword
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 更新 Password 并撤销该 User 的全部 Session。
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/admin/profile:
    get:
      tags: [Admin Profile]
      operationId: getAdminProfile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 返回当前 User Profile。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin Profile]
      operationId: updateAdminProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 返回更新后的 User Profile。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/profile/password:
    put:
      tags: [Admin Profile]
      operationId: updateAdminPassword
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '204':
          description: 更新 Password，撤销全部 Session 并清除当前 Cookie。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/articles:
    get:
      tags: [Admin Articles]
      operationId: listAdminArticles
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ArticleStatus' }
        - name: sort
          in: query
          description: 排序字段白名单；非法值静默回退 `updated_at`。
          schema:
            type: string
            enum: [updated_at, created_at, published_at, title]
            default: updated_at
        - name: order
          in: query
          description: 排序方向；非法值静默回退 `desc`。稳定 Tie-breaker 恒为 `id DESC`。
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: 返回具备稳定 Total 语义的 Article Page。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Articles]
      operationId: createAdminArticleDraft
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
      responses:
        '201':
          description: Draft 已写入 PostgreSQL。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/articles/preview:
    post:
      tags: [Admin Articles]
      operationId: previewAdminArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewArticleRequest'
      responses:
        '200':
          description: 返回经过 `comrak` Render 和 `ammonia` Sanitization 的 HTML。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/articles/{id}:
    get:
      tags: [Admin Articles]
      operationId: getAdminArticle
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 返回 Article 的 Markdown 原文和当前版本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin Articles]
      operationId: updateAdminArticle
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
      responses:
        '200':
          description: 返回保存后的 Article 和新版本号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Articles]
      operationId: deleteAdminArticle
      description: 物理删除文章及其 Revision 与 Tag 关联；仅 `recycled` 状态允许删除，否则返回 409 `ARTICLE_NOT_RECYCLED`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Article 已物理删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/articles/{id}/revisions:
    get:
      tags: [Admin Articles]
      operationId: listAdminArticleRevisions
      description: 按 `revision_no` 倒序返回 Revision 列表；响应不含密码哈希，只暴露 `password_protected`。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 返回 Article 的 Revision 列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleRevisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/articles/{id}/revisions/{rev}/restore:
    post:
      tags: [Admin Articles]
      operationId: restoreAdminArticleRevision
      description: 将指定 Revision 的 Markdown 与元数据写回文章（`status`/`published_at` 不回滚）；恢复前会自动为当前版本留档新 Revision。版本冲突返回 409 `ARTICLE_CONFLICT`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: rev
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRevisionRequest'
      responses:
        '200':
          description: 返回恢复后的 Article 和新版本号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Article 或 Revision 不存在（`ARTICLE_NOT_FOUND` / `REVISION_NOT_FOUND`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/articles/{id}/status:
    patch:
      tags: [Admin Articles]
      operationId: changeAdminArticleStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeArticleStatusRequest'
      responses:
        '200':
          description: 返回状态流转后的 Article 和新版本号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/categories:
    get:
      tags: [Admin Articles]
      operationId: listAdminArticleCategories
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 返回可用于 Article Editor 的 Category 列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleCategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Articles]
      operationId: createAdminArticleCategory
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyRequest'
      responses:
        '201':
          description: 返回新建的 Article Category。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/categories/{id}:
    put:
      tags: [Admin Articles]
      operationId: updateAdminArticleCategory
      description: 更新 Category 的 `name`/`slug`；slug 复用统一 Normalize 规则，唯一冲突返回 409 `TAXONOMY_CONFLICT`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyRequest'
      responses:
        '200':
          description: 返回更新后的 Article Category。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Articles]
      operationId: deleteAdminArticleCategory
      description: 仍被 Article 引用时返回 409 `TAXONOMY_IN_USE`，并在 `error.details.reference_count` 携带引用数。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Category 已删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/tags:
    get:
      tags: [Admin Articles]
      operationId: listAdminTags
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 返回可用于 Article Editor 的 Tag 列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleTagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Articles]
      operationId: createAdminTag
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyRequest'
      responses:
        '201':
          description: 返回新建的 Tag。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/tags/{id}:
    put:
      tags: [Admin Articles]
      operationId: updateAdminTag
      description: 更新 Tag 的 `name`/`slug`；唯一冲突返回 409 `TAXONOMY_CONFLICT`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyRequest'
      responses:
        '200':
          description: 返回更新后的 Tag。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin Articles]
      operationId: deleteAdminTag
      description: 仍被 Article 引用时返回 409 `TAXONOMY_IN_USE`，并在 `error.details.reference_count` 携带引用数。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Tag 已删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/comments:
    get:
      tags: [Admin Comments]
      operationId: listAdminComments
      description: Admin 评论列表。返回访客 Email 辅助审核判断；Public API 永不暴露该字段。
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CommentStatus' }
        - name: target_type
          in: query
          schema:
            type: string
            enum: [article, page, link]
        - name: target_id
          in: query
          schema: { type: integer, format: int64 }
        - name: keyword
          in: query
          description: 对内容 Markdown 与评论者名称做模糊匹配。
          schema: { type: string }
      responses:
        '200':
          description: 具备稳定 Total 语义的 Comment Page。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/comments/{id}:
    get:
      tags: [Admin Comments]
      operationId: getAdminComment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 评论详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Comments]
      operationId: deleteAdminComment
      description: 物理删除评论。仅 `recycled` 状态允许，其余状态返回 409 `COMMENT_NOT_RECYCLED`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: 评论已物理删除。
        '401':
          $ref: '#/components/responses/Unauthorized'
