        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/media/files/{path}:
    get:
      tags: [Public Media]
      operationId: getMediaFile
      description: "匿名可缓存的媒体文件端点；Local Provider 直接发文件（`Cache-Control: public, max-age=31536000, immutable`），S3 Provider Redirect 到公开 URL。Path 做路径穿越校验。"
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 文件内容；Content-Type 按入库时的 MIME。
          content:
            application/octet-stream: {}
        '307':
          description: S3 Provider 时 Redirect 到公开 URL。
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aries_admin_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 必须精确匹配 `ADMIN_ORIGINS` 白名单中的一项；Browser 会自动发送。
      schema:
        type: string
        format: uri
  responses:
    BadRequest:
      description: Request Validation 失败。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credentials 无效、Session 缺失或 Session 已过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Origin、Bootstrap Secret 或 Permission 不满足要求。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Bootstrap 已完成或唯一字段冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource 不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 超出 Rate Limit。本地限流（登录、评论提交等）会携带 `Retry-After` 响应头（距可重试的剩余秒数，整数）；上游 Provider 限流（如 AI）可能缺省。
      headers:
        Retry-After:
          description: 距当前限流窗口恢复、可重试的剩余秒数（向上取整，至少 1）。
          schema:
            type: integer
            minimum: 1
            example: 870
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal Error；响应不暴露 PostgreSQL 或 Rust Error Detail。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          examples: [ok]
        service:
          type: string
          examples: [aries-server]
    BootstrapStatusResponse:
      type: object
      required: [initialized]
      properties:
        initialized:
          type: boolean
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrap_secret, username, email, display_name, password]
      properties:
        bootstrap_secret:
          type: string
          minLength: 24
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_-]+$'
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
          maxLength: 128
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, avatar_url]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        avatar_url:
          type: [string, 'null']
          format: uri
          maxLength: 2048
    UpdatePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    UserResponse:
      type: object
      required: [id, username, email, display_name, avatar_url, role, permissions]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [owner, editor, moderator]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - dashboard:view
              - content:manage
              - comments:moderate
              - users:manage
              - settings:manage
              - profile:manage
    SessionResponse:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        expires_at:
          type: string
          format: date-time
    ArticleStatus:
      type: string
      enum: [draft, published, recycled]
    ArticleStatusCommand:
      type: string
      enum: [publish, recycle, recover]
    ChangeArticleStatusRequest:
      type: object
      additionalProperties: false
      required: [command, expected_version]
      properties:
        command:
