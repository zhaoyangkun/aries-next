          items: { type: string }
    LogStatsBucket:
      type: object
      description: 单个时间桶；五个级别键恒在，无数据为 0。
      required: [bucket, ERROR, WARN, INFO, DEBUG, TRACE]
      properties:
        bucket:
          description: 桶起点，RFC 3339；≤48 小时窗口按小时分桶，更长窗口按天分桶。
          type: string
          format: date-time
        ERROR: { type: integer, format: int64 }
        WARN: { type: integer, format: int64 }
        INFO: { type: integer, format: int64 }
        DEBUG: { type: integer, format: int64 }
        TRACE: { type: integer, format: int64 }
    LogStatsResponse:
      type: object
      required: [hours, buckets, channel_dropped]
      properties:
        hours:
          description: 实际统计窗口（小时），经 1–168 收敛后的值。
          type: integer
          minimum: 1
          maximum: 168
        buckets:
          description: 按时间升序的分桶结果。
          type: array
          items:
            $ref: '#/components/schemas/LogStatsBucket'
        channel_dropped:
          description: 运行日志 channel 满累计丢弃条数（可丢弃数据，仅作观测）。
          type: integer
          minimum: 0
          format: int64
