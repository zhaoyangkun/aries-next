    PublicGalleryDetail:
      type: object
      required: [slug, title, description, items]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicGalleryItem'
    PublicComment:
      type: object
      description: 公开评论 DTO；永不包含 Email/IP/UA。访客头像为 Email SHA-256 拼出的 Cravatar URL，管理员回复头像为站点 Logo（未配置为 null）。`children` 为该根评论下的回复（回复的回复平铺在同一根下，最多两级）。
      required: [id, parent_id, nickname, avatar_url, website, content_html, is_admin, created_at, children]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: [integer, 'null'], format: int64 }
        nickname: { type: string, description: 评论者昵称（管理员回复为管理员展示名） }
        avatar_url: { type: [string, 'null'], description: Cravatar 头像 URL 或站点 Logo }
        website:
          type: [string, 'null']
          description: 访客自己提交的站点链接（入库前已校验 http/https）；管理员回复恒为 null。前端可把昵称渲染成该外链（对齐 Twikoo 行为）。
        content_html: { type: string, description: 服务端渲染并 Sanitize 后的 HTML }
        is_admin: { type: boolean, description: 是否为管理员回复 }
        created_at: { type: string, format: date-time }
        children:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
    PublicCommentCreated:
      allOf:
        - $ref: '#/components/schemas/PublicComment'
        - type: object
          description: 提交成功的响应；`status` 供前端提示「待审核」（pending/approved 取决于站点评论策略）。
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, approved]
    PublicCommentPageResponse:
      type: object
      description: 已批准评论树分页；分页只作用于根评论，`total` 为根评论总数。
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
        total: { type: integer, format: int64 }
        page: { type: integer }
        page_size: { type: integer }
    CreatePublicCommentRequest:
      type: object
      description: 访客发表评论；`target_type` 支持 `article` / `page`，按 `target_slug` 定位已发布目标。`website` 可选且仅允许 http/https。
      required: [target_type, target_slug, nickname, email, content]
      properties:
        target_type: { type: string, enum: [article, page, link], description: 评论目标类型；公开提交仅接受 article / page }
        target_slug: { type: string }
        nickname: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        website: { type: [string, 'null'], maxLength: 2048 }
        content: { type: string, minLength: 1, maxLength: 2000, description: Markdown 源文本 }
    ReplyPublicCommentRequest:
      type: object
      description: 回复评论；规则同 CreatePublicCommentRequest（目标继承被回复评论）。
      required: [nickname, email, content]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 60 }
        email: { type: string, format: email, maxLength: 254 }
        website: { type: [string, 'null'], maxLength: 2048 }
        content: { type: string, minLength: 1, maxLength: 2000, description: Markdown 源文本 }
    PublicPhoto:
      type: object
      description: 公开照片墙条目；媒体 URL/尺寸与相册、分类信息已由服务端解析。
      required: [url, alt, location, width, height, gallery_slug, gallery_title, category_name]
      properties:
        url: { type: string, description: 媒体公开 URL }
        alt: { type: string, description: 条目 alt 文本（可为空串） }
        location: { type: string, description: 拍摄地点（可为空串） }
        width: { type: [integer, 'null'], description: 图片宽度（探测失败时为 null） }
        height: { type: [integer, 'null'], description: 图片高度（探测失败时为 null） }
        gallery_slug: { type: string, description: 所属相册 Slug }
        gallery_title: { type: string, description: 所属相册标题 }
        category_name: { type: [string, 'null'], description: 所属相册的分类名（分类已删除时为 null） }
    PublicLink:
      type: object
      description: 公开友情链接；不含 `status`/`sort_order` 等管理字段，`category_name` 供前端按分类分组展示。
      required: [title, url, icon_url, description, category_id, category_name]
      properties:
        title: { type: string }
        url: { type: string }
        icon_url: { type: [string, 'null'] }
        description: { type: string }
        category_id: { type: [integer, 'null'], format: int64 }
        category_name:
          type: [string, 'null']
          description: 友链分类名；未分类或分类已删除时为 null（解析失败降级，不影响整个列表）。
    PublicNavigationNode:
      type: object
      description: 公开导航节点；`children` 为一级节点的子菜单（最多两级）。`href` 为服务端解析后的路由地址（url 原样、article → `/articles/{slug}`、page → `/custom/{slug}`、category → `/categories/{slug}`）；目标不存在或未发布的节点连同子树被剔除。
      required: [label, target_type, target_id, url, href, open_in_new_tab, children]
      properties:
        label: { type: string }
        target_type: { $ref: '#/components/schemas/NavigationTargetType' }
        target_id: { type: [integer, 'null'], format: int64 }
        url: { type: [string, 'null'] }
        href:
          type: [string, 'null']
          description: 解析后的可访问地址；url 类型与 url 相同，内部目标为按 slug 拼出的路由。
        open_in_new_tab: { type: boolean }
        children:
          type: array
          items:
            $ref: '#/components/schemas/PublicNavigationNode'
