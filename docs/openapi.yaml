          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/comments:
    post:
      tags:
      - Public Comments
      summary: 访客发表评论
      description: 目标只允许已发布文章（`article`）或已发布页面（`page`），按 `target_slug` 定位。初始状态由站点评论策略决定：`moderated` → `pending`、`auto_approve` → `approved`、`closed` → 403 `COMMENTS_CLOSED`。Markdown 由服务端渲染并 Sanitize；Email/IP/UA 只存 Hash，不出现在任何响应中。同一客户端 60 秒最多 3 条（429 `RATE_LIMITED`）；相同 Email + 目标 + 内容 5 分钟内重复提交返回 409 `COMMENT_DUPLICATE`。
      operationId: createComment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
        required: true
      responses:
        '200':
          description: 创建成功；`status` 供前端提示「待审核」。响应禁止缓存（no-store）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentCreatedResponse'
        '400':
          description: 昵称/邮箱/主页/内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 站点评论已关闭（COMMENTS_CLOSED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 评论目标不存在或未发布（COMMENT_TARGET_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 重复提交（COMMENT_DUPLICATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 提交过于频繁（RATE_LIMITED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/comments/{id}/replies:
    post:
      tags:
      - Public Comments
      summary: 访客回复评论
      description: 只允许回复 `approved` 状态的评论，其余一律 404 `COMMENT_NOT_FOUND`（不泄露未审核评论的存在）。回复回复时新评论挂到同一根下，保持两级展示。校验、限流与策略规则同 `POST /api/public/comments`。
      operationId: replyComment
      parameters:
      - name: id
        in: path
        description: 被回复的评论 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyCommentRequest'
        required: true
      responses:
        '200':
          description: 创建成功；`status` 供前端提示「待审核」。响应禁止缓存（no-store）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentCreatedResponse'
        '400':
          description: 昵称/邮箱/主页/内容校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 站点评论已关闭（COMMENTS_CLOSED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 被回复的评论不存在（COMMENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 重复提交（COMMENT_DUPLICATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 提交过于频繁（RATE_LIMITED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
