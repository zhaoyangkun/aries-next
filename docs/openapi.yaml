      description: 通过 `publish` / `recycle` / `recover` 命令做状态机流转；乐观锁校验 expected_version。
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeArticleStatusRequest'
        required: true
      responses:
        '200':
          description: 返回状态流转后的 Article 和新版本号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          description: 非法状态迁移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突或非法状态迁移（ARTICLE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/audit-logs:
    get:
      tags:
      - Admin Audit
      summary: 审计日志查询
      description: Admin 敏感操作审计日志查询，仅 Owner（`settings:manage`）可访问。时间范围按 `created_at` 左闭右开过滤，格式 RFC 3339；非法时间值返回 400 `INVALID_DATE_RANGE`。
      operationId: listAuditLogs
      parameters:
      - name: page
        in: path
        description: 页码，从 1 开始。
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: path
        description: 每页条数（1–100）。
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: actor_user_id
        in: path
        description: 操作人 User ID 精确过滤。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: action
        in: path
        description: 动作精确过滤，如 `article.created`、`comment.moderated`。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: target_type
        in: path
        description: 目标类型精确过滤，如 `article`、`comment`、`site_settings`。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: target_id
        in: path
        description: 目标 ID 精确过滤。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: start
        in: path
        description: 时间范围起点（按 `created_at` 左闭右开过滤），格式 RFC 3339；非法值返回 400 `INVALID_DATE_RANGE`。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: end
        in: path
        description: 时间范围终点，格式同 `start`。
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageResponse'
        '400':
          description: start/end 非合法 RFC 3339 时间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 非 Owner（settings:manage）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/auth/login:
    post:
      tags:
      - Admin Auth
      summary: 管理员登录
      description: 用户名或邮箱 + 密码认证；成功后撤销旧 Session、签发新 Session Cookie（HttpOnly，Path 限定 /api/admin）。账号维度 5 次/15 分钟、IP 维度 30 次/15 分钟双重限流，未命中用户也执行一次 Argon2id 以掩盖账号枚举的时间差异。
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: 认证成功并签发 Session Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: 用户名或密码错误，或账号已被禁用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/logout:
    post:
      tags:
      - Admin Auth
      summary: 管理员登出
      description: 撤销当前 Session 并清除 Session Cookie，返回 204。
      operationId: logout
      responses:
        '204':
          description: 撤销当前 Session 并清除 Cookie
        '401':
          description: 未认证或 Session 已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/auth/password/forgot:
    post:
      tags:
      - Admin Auth
      summary: 请求密码重置
      description: 无论账号是否存在都返回相同响应（202），避免账号枚举；每邮箱 3 次/15 分钟限流。Phase 05 接入 Email Adapter 前不会发送 Email，Reset Token 不落库明文。
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          description: 无论账号是否存在都返回相同响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 邮箱格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/password/reset:
    post:
      tags:
      - Admin Auth
      summary: 重置密码
      description: 凭 Password Reset Token 设置新密码，成功后撤销该 User 的全部 Session，返回 204；Token 无效或已过期时返回 400。每 Token 维度 3 次/15 分钟限流。
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: 更新 Password 并撤销该 User 的全部 Session
        '400':
          description: Token 无效或已过期，或新密码不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin 校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/session:
    get:
      tags:
      - Admin Auth
      summary: 查询当前会话
      description: 返回当前 Session 对应的 User 视图与 Session 过期时间；无有效 Session Cookie 时返回 401。
      operationId: getSession
      responses:
        '200':
          description: 当前 Session 与 User 视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
