          description: 当前浏览量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleViewResponse'
        '404':
          description: 文章不存在或未发布（`ARTICLE_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/categories:
    get:
      tags:
