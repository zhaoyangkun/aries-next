  /api/admin/logs/tail:
    get:
      tags: [Admin Logs]
      operationId: tailAdminLogs
      description: "实时推送运行日志（SSE，`text/event-stream`）：以连接时刻的最大日志 id 为锚点，每 500ms 轮询推送之后写入且匹配筛选的新日志。事件为 `event: log`、`data` 为单个日志条目（形状同 `LogListItem`）；锚点查询失败时推送 `event: error` 后结束。筛选参数语义与列表接口一致（`level` 为最低级别；`target` 与 `exclude_target` 互斥，同用返回 400 `INVALID_FILTER`）。仅 Owner（`ManageSettings`）可访问。"
      security:
        - cookieAuth: []
      parameters:
        - name: level
          in: query
          description: 最低级别（同列表语义）。
          schema: { type: string, enum: [ERROR, WARN, INFO, DEBUG, TRACE] }
        - name: target
          in: query
          description: tracing target 精确匹配；与 `exclude_target` 互斥。
          schema: { type: string }
        - name: exclude_target
          in: query
          description: 精确排除该 target；与 `target` 互斥。
          schema: { type: string }
        - name: keyword
          in: query
          description: message 与 fields 模糊匹配（ILIKE，%/_ 转义）。
          schema: { type: string }
        - name: request_id
          in: query
          description: 请求链路追踪：精确匹配 request_id。
          schema: { type: string }
      responses:
        '200':
          description: SSE 流（持续响应，客户端断开即结束）。
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: log\ndata: {\"id\": 1, \"ts\": \"2026-09-12T00:00:00Z\", \"level\": \"INFO\", \"target\": \"aries_server\", \"message\": \"request completed\", \"span_name\": \"http_request\", \"request_id\": \"...\", \"fields\": {}}"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
