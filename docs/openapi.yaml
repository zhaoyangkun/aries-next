      description: 浏览量 +1；同一客户端（IP + User-Agent 指纹）30 分钟滑动窗口内重复调用只计一次，窗口内重复调用返回当前计数。客户端不能指定计数值。响应 `no-store`。
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 当前浏览量。
          content:
            application/json:
              schema:
                type: object
                required: [visit_count]
                properties:
                  visit_count: { type: integer, format: int64, minimum: 0 }
        '404':
          $ref: '#/components/responses/NotFound'
