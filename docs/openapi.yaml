      - id
      - name
      - slug
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
    UnlockRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          description: 访问密码。
    UnlockResponse:
      type: object
      description: 解锁成功响应：`Set-Cookie` 同时携带访问凭据。
      required:
      - unlocked
      properties:
        unlocked:
          type: boolean
          description: 恒为 `true`。
    UpdateArticleRequest:
      type: object
      required:
      - title
      - expected_version
      properties:
        access_password:
          type:
          - string
          - 'null'
          description: |-
            文章访问密码（明文，服务端以 Argon2id 哈希后存储，任何响应都不回显）。
            三层语义：缺省不改动、显式 `null` 清除、字符串设置新密码（Trim 后少于 6 个字符返回 400）。
        ai_brief:
          type:
          - string
          - 'null'
          description: AI 导读（TL;DR）；三层语义：缺省不改动、显式 null 清除、字符串设置。
        allow_comments:
          type: boolean
          description: 是否允许评论，默认 `true`。
        category_id:
          type:
          - integer
          - 'null'
          format: int64
          description: 所属分类 ID。
        cover_url:
          type:
          - string
          - 'null'
          description: 封面图 URL。
        expected_version:
          type: integer
          format: int64
          description: 乐观锁版本号：必须等于当前 `version`，否则返回 409 `ARTICLE_CONFLICT`。
        is_pinned:
          type: boolean
          description: 是否置顶，默认 `false`。
        markdown_source:
          type: string
          description: Markdown 原文，最长 1,000,000 字符。
        seo_keywords:
          type: array
          items:
            type: string
          description: SEO 关键字（Trim、排序、去重，最多 20 个，单个最长 50 字符）。
        slug:
          type:
          - string
          - 'null'
          description: URL 别名；缺省时保持现有值。
        summary:
          type: string
          description: 摘要，最长 500 字符。
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 关联标签 ID 列表。
        title:
          type: string
          description: 文章标题（Trim 后非空，最长 200 字符）。
    UpdateMediaRequest:
      type: object
      properties:
        alt:
          type: string
          description: 替换说明文字；缺省为空串。
        original_name:
          type:
          - string
          - 'null'
          description: 替换原始文件名；缺省或空串表示不改动。
    UpdatePasswordRequest:
      type: object
      title: UpdatePasswordRequest
      description: 修改当前登录用户密码；成功后撤销该用户全部 Session 并清除当前 Cookie。
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          description: 当前密码；校验失败返回 400 `INVALID_CURRENT_PASSWORD`。
        new_password:
          type: string
          description: 新密码；需通过 Password Policy 校验（400 `INVALID_PASSWORD`）。
    UpdateProfileRequest:
      type: object
      title: UpdateProfileRequest
      description: 更新当前登录用户的 Profile。
      required:
      - email
      - display_name
      properties:
        avatar_url:
          type:
          - string
          - 'null'
          description: 头像 URL；缺省/null/空串表示清除，非空必须是 http/https 绝对 URL（400 `INVALID_AVATAR_URL`）。
        display_name:
          type: string
          description: 显示名；长度与字符白名单校验，非法返回 400。
        email:
          type: string
          description: 邮箱；会 Normalize 并校验格式与唯一性，冲突返回 409。
    UpdateSiteSettingsRequest:
      type: object
      title: UpdateSiteSettingsRequest
      description: 全量更新站点设置。`site_url`/`logo_url`/`default_cover_url` 允许为空或以 `/` 开头的站内绝对路径，非空外链必须是 http/https URL（400 `INVALID_URL`）；三个 Page Size 取值 1–100（400 `INVALID_PAGE_SIZE`）；`comments_per_page` 取值 5–100；`comment_policy` 为 `closed`/`moderated`/`auto_approve`（400 `INVALID_COMMENT_POLICY`）。
      required:
      - site_name
      - page_size_index
      - page_size_archive
      - page_size_search
      properties:
        comment_policy:
          type: string
          description: 评论策略，缺省 `moderated`。
        comments_per_page:
          type: integer
          format: int32
          description: 评论每页条数，缺省 20。
        default_cover_url:
          type: string
        icp_text:
          type: string
        logo_url:
          type: string
        page_size_archive:
          type: integer
          format: int32
        page_size_index:
          type: integer
          format: int32
        page_size_search:
          type: integer
          format: int32
        site_description:
          type: string
        site_name:
          type: string
          description: 站点名称，Trim 后 1–100 字符（400 `INVALID_SITE_NAME`）。
        site_url:
          type: string
    UploadMediaForm:
      type: object
      description: |-
        `POST /api/admin/media` 的 Multipart 表单；实际字段名为 `file[]`（兼容 `file`），
        每批 1–5 个文件，单文件 ≤ 5MB。
      required:
      - file
      properties:
        file:
          type: array
          items:
            type: string
            format: binary
          description: 待上传图片文件（jpg/jpeg/png/gif/bmp/webp）。
    UserResponse:
      type: object
      required:
      - id
      - username
      - email
      - display_name
      - role
      - permissions
      properties:
        avatar_url:
          type:
          - string
          - 'null'
          description: 头像 URL，未设置时为 null。
        display_name:
          type: string
          description: 显示名。
        email:
          type: string
          description: 邮箱地址。
        id:
          type: integer
          format: int64
          description: User ID。
        permissions:
          type: array
          items:
            type: string
          description: 该角色拥有的权限标识列表。
        role:
          type: string
          description: 角色：owner / editor / moderator。
        username:
          type: string
          description: 登录用户名。
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aries_admin_session
