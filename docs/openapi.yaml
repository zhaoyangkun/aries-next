          description: 最近的 Span 名（HTTP 请求内日志为 TraceLayer Span）。
          type: [string, 'null']
        request_id:
          description: 请求的 `x-request-id`；可按此值查询整条请求链路。
          type: [string, 'null']
        fields:
          description: 事件的其余结构化字段。
          type: object
    LogPageResponse:
      type: object
