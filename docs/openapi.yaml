        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: feature
          in: query
          schema: { type: string, enum: [editor_rewrite, editor_summary, editor_metadata, comment_moderation] }
      responses:
        '200':
          description: 用量审计分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsagePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/public/articles:
    get:
      tags: [Public Articles]
      operationId: listPublicArticles
      description: 匿名可访问；只返回 `published` 状态文章。固定排序 `is_pinned DESC, sort_order ASC, published_at DESC, id DESC`，不提供排序参数。缺省分页大小取站点设置 `page_size_index`。`page > 1` 且当前页结果为空时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200），阻止爬虫沿 `?page=N` 生成无限重复 URL。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          schema: { type: string }
        - name: category_id
          in: query
          schema: { type: integer, format: int64 }
        - name: tag_id
          in: query
          schema: { type: integer, format: int64 }
        - name: category
          in: query
          description: 按分类 Slug 过滤（大小写不敏感）。
          schema: { type: string }
        - name: tag
          in: query
          description: 按标签 Slug 过滤（大小写不敏感）。
          schema: { type: string }
      responses:
        '200':
          description: 返回已发布 Article 的分页结果；列表项不含 Markdown 原文与内部字段。
          headers:
            Cache-Control:
              schema: { type: string }
              examples: ['public, max-age=60']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePageResponse'
        '404':
          description: 越界分页（`PAGE_OUT_OF_RANGE`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}:
    get:
      tags: [Public Articles]
      operationId: getPublicArticle
      description: "匿名可访问；Slug 不区分大小写。草稿、回收站或不存在的 Slug 一律返回 404 `ARTICLE_NOT_FOUND`。受密码保护的文章返回 `password_protected: true` 且 `rendered_html: null`，携带有效解锁 Cookie（见 access 端点）后返回正文。普通文章响应 `Cache-Control: public, max-age=60`，密码文章为 `private, no-store`。"
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 返回已发布 Article 的公开详情；不含 `markdown_source`、`author_id`、`version`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/public/articles/{slug}/access:
    post:
      tags: [Public Articles]
      operationId: unlockPublicArticle
      description: 校验访问密码；成功后下发 HttpOnly Cookie `aries_article_access_{article_id}`（Path 限定本文详情、SameSite=Lax、2 小时），值为 HMAC-SHA256 凭据，密码修改后自动失效。同一客户端对同一文章限流 5 次/分钟。响应对所有缓存 `no-store`。
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: 解锁成功，`Set-Cookie` 携带访问凭据。
          content:
            application/json:
              schema:
                type: object
                required: [unlocked]
                properties:
                  unlocked: { type: boolean }
        '400':
          description: 文章未设置访问密码（`ARTICLE_NOT_PROTECTED`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 密码错误（`INVALID_ARTICLE_PASSWORD`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/public/articles/{slug}/views:
    post:
