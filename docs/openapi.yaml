        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/imports/{id}:
    get:
      tags: [Admin Media]
      operationId: getAdminImport
      security:
        - cookieAuth: []
