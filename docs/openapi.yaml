      description: 运行时切换 SQL 语句日志开关（tracing_subscriber reload），无需重启；`LOG_SQL` 环境变量仅作为启动初始值。仅 Owner（`ManageSettings`）可访问。
      operationId: setSqlLogging
      requestBody:
