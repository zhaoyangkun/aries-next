      responses:
        '201':
          description: 全部文件已入库；同内容 Hash 的资产带 `duplicate_of` 提示。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/media/remote:
    post:
      tags: [Admin Media]
      operationId: uploadAdminMediaFromUrl
      description: 抓取远端图片并入库。SSRF 防护：仅 http/https，拒绝内网与环回地址，Redirect 最多 3 次且逐跳重校验，Body ≤ 5MB，超时 10s。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteUploadRequest'
      responses:
        '201':
          description: 远端文件已下载并入库。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/media/batch-delete:
    post:
      tags: [Admin Media]
      operationId: batchDeleteAdminMedia
      description: 批量软删除，部分成功语义。被引用的资产保持 active 并归入 `referenced`；不存在或已删除的 ID 归入 `not_found`。单次 1–100 个 ID（服务端去重）。有实际删除时自动入队 `media_cleanup` 任务，并记录 `media.batch_delete` 审计事件。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteMediaRequest'
      responses:
        '200':
          description: 逐项归类结果（deleted / referenced / not_found 均按 ID 升序）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBatchDeleteResult'
        '400':
          description: 空批次或超过 100 个 ID（`INVALID_BATCH_DELETE`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/media/{id}:
    get:
      tags: [Admin Media]
      operationId: getAdminMedia
