  /api/admin/logs:
    get:
      tags:
      - Admin Logs
      summary: 运行日志查询
      description: 数据来自 `server_logs` 表（tracing 事件批量落库）。`start`/`end` 按 `ts` 左闭右开过滤，格式 RFC 3339，非法值返回 400 `INVALID_DATE_RANGE`；`target` 与 `exclude_target` 互斥，同用返回 400 `INVALID_FILTER`。提供 `around_id` 时进入上下文模式：以锚点行的 `ts` 为中心前后各取 `context` 条，忽略分页/时间范围/排序参数，锚点不存在返回 404 `LOG_ENTRY_NOT_FOUND`。仅 Owner（`ManageSettings`）可访问。
      operationId: listLogs
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: level
        in: path
        description: 最低级别：WARN 含 WARN+ERROR；空为全部。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: target
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: keyword
        in: path
        description: message 与 fields（JSON 文本）模糊匹配（ILIKE，%/_ 会被转义）。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: request_id
        in: path
        description: 请求链路追踪：精确匹配 request_id，空串忽略。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: exclude_target
        in: path
        description: 精确排除该 target（如 `sqlx::query`）；与 `target` 互斥。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: around_id
        in: path
        description: 上下文模式锚点：以该行的 ts 为中心取前后日志。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: context
        in: path
        description: 上下文模式窗口：前后各取 context 条，默认 20，上限 100。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: order
        in: path
        description: 排序方向：asc/desc，默认 desc；链路场景用 asc 按时间正序看流转。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: start
        in: path
        description: 时间范围左闭右开，RFC 3339。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: end
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 运行日志分页，附最近 24 小时各级别条数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPageResponse'
        '400':
          description: 时间格式非法或 target/exclude_target 同用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 settings:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 上下文模式锚点不存在（LOG_ENTRY_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
