      description: Multipart 字段名 `file[]`，每批 1–5 个文件，单文件 ≤ 5MB；扩展名白名单 jpg/jpeg/png/gif/bmp/webp，并校验 Magic Bytes 与声明 MIME。响应恒为数组。
