openapi: 3.1.0
info:
  title: Aries Next API
  description: Aries Next 博客系统 API（由 utoipa 注解自动生成，权威契约即本文件）
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
servers:
- url: /
paths:
  /api/admin/ai/editor/brief:
    post:
      tags:
      - Admin AI
      summary: 根据标题与正文生成 AI 导读 TL;DR（SSE 流式）
      description: 输出 150 字以内 TL;DR 纯文本；事件序列与门禁同 `aiEditorRewrite`；导读由前端写入文章 `ai_brief` 字段随文保存。
      operationId: aiEditorBrief
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
        required: true
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: {}
        '400':
          description: 输入长度非法（INVALID_AI_INPUT）或 AI 未配置（AI_NOT_CONFIGURED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限、AI 未启用（AI_DISABLED）或该功能未开启（AI_FEATURE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/editor/metadata:
    post:
      tags:
      - Admin AI
      summary: 建议 slug/keywords/description（SSE 流式）
      description: Provider 被要求输出 JSON，服务端在 `done` 前校验累积文本为合法 JSON，不合格以 `error`（`AI_INVALID_OUTPUT`）终止；前端自行解析 delta 拼接的 JSON 文本。
      operationId: aiEditorMetadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
        required: true
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: {}
        '400':
          description: 输入长度非法（INVALID_AI_INPUT）或 AI 未配置（AI_NOT_CONFIGURED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限、AI 未启用（AI_DISABLED）或该功能未开启（AI_FEATURE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/editor/rewrite:
    post:
      tags:
      - Admin AI
      summary: 改写选中的 Markdown 片段（SSE 流式）
      description: 需要 `content:manage` 权限与 `editor_assist` 功能开关。事件序列：`start`（feature/model/prompt_version）→ `delta` × N（`{text}`）→ `usage`（可选，token 用量）→ `done`；失败时以 `error`（`{code}`：`AI_PROVIDER_FAILED` / `AI_PROVIDER_TIMEOUT` / `AI_RATE_LIMITED` / `AI_INVALID_OUTPUT`）终止。每用户每分钟限 10 次。每次请求落 `ai_requests` 审计并写 Audit（不含完整 Prompt）。
      operationId: aiEditorRewrite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
        required: true
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: {}
        '400':
          description: 输入长度非法（INVALID_AI_INPUT）或 AI 未配置（AI_NOT_CONFIGURED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限、AI 未启用（AI_DISABLED）或该功能未开启（AI_FEATURE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/editor/summary:
    post:
      tags:
      - Admin AI
      summary: 根据标题与正文生成摘要草稿（SSE 流式）
      description: 需要 `content:manage` 权限与 `editor_assist` 功能开关；事件序列与门禁同 `aiEditorRewrite`。
      operationId: aiEditorSummary
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
        required: true
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: {}
        '400':
          description: 输入长度非法（INVALID_AI_INPUT）或 AI 未配置（AI_NOT_CONFIGURED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限、AI 未启用（AI_DISABLED）或该功能未开启（AI_FEATURE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/editor/tags:
    post:
      tags:
      - Admin AI
      summary: 根据标题与正文推荐文章标签（SSE 流式）
      description: 'Provider 被要求输出 JSON（形如 `{"tags": ["标签"]}`），服务端在 `done` 前校验累积文本为合法 JSON，不合格以 `error`（`AI_INVALID_OUTPUT`）终止；前端按名称匹配现有标签或新建后选中。'
      operationId: aiEditorTags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryRequest'
        required: true
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream: {}
        '400':
          description: 输入长度非法（INVALID_AI_INPUT）或 AI 未配置（AI_NOT_CONFIGURED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限、AI 未启用（AI_DISABLED）或该功能未开启（AI_FEATURE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/models:
    get:
      tags:
      - Admin AI
      summary: 拉取当前 Provider 账号的可用模型列表
      description: 只要求已保存 api_key，不要求总开关已启用或 model 已配置；OpenAI 兼容协议还要求已保存 base_url。每用户限流 10 次/分钟。
      operationId: listAiModels
      responses:
        '200':
          description: 可用模型 ID 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiModelsResponse'
        '400':
          description: 未保存 api_key/base_url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 settings:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发每用户每分钟 10 次限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider 请求失败或超时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/ai/usage:
    get:
      tags:
      - Admin AI
      summary: AI 请求用量审计分页查询
      description: 需要 `settings:manage` 权限；可按 `feature` 过滤，按创建时间倒序。`operator_user_id` 为 null 表示系统触发（评论自动审核）。
      operationId: listAiUsage
      parameters:
      - name: page
        in: query
        description: 页码，从 1 开始。
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: query
        description: 每页条数（1–100）。
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: feature
        in: query
        description: 按功能过滤：`editor_rewrite` / `editor_summary` / `editor_metadata` / `comment_moderation` / `editor_tags` / `ai_brief` / `search_ask`。
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 用量审计分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsagePageResponse'
        '400':
          description: feature 参数非法（INVALID_AI_PARAMETER）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 settings:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles:
    get:
      tags:
      - Admin Articles
      summary: 分页查询文章列表
      description: 返回具备稳定 Total 语义的 Article Page。非法排序参数静默回退默认值，列表接口不因排序参数报错。
      operationId: listArticles
      parameters:
      - name: page
        in: path
        description: 页码，从 1 开始。
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: path
        description: 每页条数。
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: keyword
        in: path
        description: 标题/摘要关键字过滤。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: status
        in: path
        description: 按状态过滤：`draft` / `published` / `recycled`。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: category_id
        in: path
        description: 按分类 ID 过滤。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: tag_id
        in: path
        description: 按标签 ID 过滤。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: sort
        in: path
        description: 排序字段白名单；非法值静默回退 `updated_at`。`sort_order` 为手动排序值（「排序」模式的拖拽/箭头调整）。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: order
        in: path
        description: 排序方向；非法值静默回退 `desc`。稳定 Tie-breaker 恒为 `id DESC`。
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 返回具备稳定 Total 语义的 Article Page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePageResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
    post:
      tags:
      - Admin Articles
      summary: 创建文章（草稿）
      description: 在 HTTP 层完成 Markdown 渲染，Draft 写入 PostgreSQL 并自动同步媒体引用。
      operationId: createArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArticleRequest'
        required: true
      responses:
        '201':
          description: Draft 已写入 PostgreSQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          description: 标题为空、内容超长、SEO 关键字非法或访问密码过短
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/imports:
    post:
      tags:
      - Admin Media
      summary: 批量导入 Markdown 文章
      description: Multipart 字段名 `file[]`，1–10 个 `.md` 文件，单文件 ≤ 2MB；解析 YAML Front Matter（title/slug/tags/category/summary）并生成 Slug 冲突预览，结果存入 Background Job。
      operationId: importMarkdown
      requestBody:
        description: 待导入的 Markdown 文件批次
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMarkdownForm'
        required: true
      responses:
        '201':
          description: 导入预览已生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '400':
          description: 文件类型/大小/编码不合法或 Multipart 非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无内容管理权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/preview:
    post:
      tags:
      - Admin Articles
      summary: 预览 Markdown 渲染结果
      description: 返回经过 `comrak` 渲染和 `ammonia` Sanitization 的 HTML，不落库。
      operationId: previewArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewArticleRequest'
        required: true
      responses:
        '200':
          description: 返回渲染并 Sanitization 后的 HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewArticleResponse'
        '400':
          description: 内容超长（ARTICLE_CONTENT_TOO_LONG）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/reorder:
    put:
      tags:
      - Admin Articles
      summary: 批量重排文章手动排序值
      description: 批量重排文章手动排序值（`sort_order`，下锚语义）：这批文章整体落到原 `sort_order` 槽位区间正前方的连续新区块，块内顺序即入参顺序；未入参文章的相对位置不受影响。典型 payload 是「排序」模式下当前页的完整有序 id 列表（1–500 个，不得重复）；幂等，重复提交同一列表结果一致。
      operationId: reorderArticles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderArticlesRequest'
        required: true
      responses:
        '204':
          description: 排序已更新（无响应体）
        '400':
          description: 入参为空、含重复 id 或超过 500 个（INVALID_REORDER_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/{id}:
    get:
      tags:
      - Admin Articles
      summary: 获取文章详情
      description: 返回 Article 的 Markdown 原文和当前版本。
      operationId: getArticle
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 返回 Article 的 Markdown 原文和当前版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
    put:
      tags:
      - Admin Articles
      summary: 更新文章
      description: 乐观锁更新：expected_version 必须等于当前 version。`access_password` 与 `ai_brief` 三层语义：缺省不改动、显式 null 清除、字符串设置。
      operationId: updateArticle
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArticleRequest'
        required: true
      responses:
        '200':
          description: 返回保存后的 Article 和新版本号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '400':
          description: 标题为空、内容超长、SEO 关键字非法或访问密码过短
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突或 Slug 冲突（ARTICLE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
    delete:
      tags:
      - Admin Articles
      summary: 物理删除文章
      description: 物理删除文章及其 Revision 与 Tag 关联；仅 `recycled` 状态允许删除，否则返回 409 `ARTICLE_NOT_RECYCLED`。
      operationId: deleteArticle
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Article 已物理删除（无响应体）
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 文章非 recycled 状态（ARTICLE_NOT_RECYCLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/{id}/revisions:
    get:
      tags:
      - Admin Articles
      summary: 查询文章 Revision 列表
      description: 按 `revision_no` 倒序返回 Revision 列表；响应不含密码哈希，只暴露 `password_protected`。
      operationId: listRevisions
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 返回 Article 的 Revision 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevisionResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在（ARTICLE_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/{id}/revisions/{rev}/restore:
    post:
      tags:
      - Admin Articles
      summary: 恢复指定 Revision
      description: 将指定 Revision 的 Markdown 与元数据写回文章（`status`/`published_at` 不回滚）；恢复前会自动为当前版本留档新 Revision。版本冲突返回 409 `ARTICLE_CONFLICT`。
      operationId: restoreRevision
      parameters:
      - name: id
        in: path
        description: 文章 ID
        required: true
        schema:
          type: integer
          format: int64
      - name: rev
        in: path
        description: Revision 版本号，从 1 开始
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRevisionRequest'
        required: true
      responses:
        '200':
          description: 返回恢复后的 Article 和新版本号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 content:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Article 或 Revision 不存在（ARTICLE_NOT_FOUND / REVISION_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本冲突（ARTICLE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/articles/{id}/status:
    patch:
      tags:
      - Admin Articles
