      description: 浏览量 +1；同一客户端（IP + User-Agent 指纹）30 分钟滑动窗口内重复调用只计一次，窗口内重复调用返回当前计数。客户端不能指定计数值。响应 `no-store`。
      operationId: recordArticleView
