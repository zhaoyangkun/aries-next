          description: '切换后的开关状态（`{ "enabled": bool }`）'
          content:
            application/json:
              schema: {}
        '400':
          description: 请求体非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
