  /api/admin/logs/stats:
    get:
      tags:
      - Admin Logs
      summary: 运行日志分桶统计
      description: 趋势图数据：`hours` 默认 24、范围 1–168；≤48 小时按小时分桶，>48 小时按天分桶（`date_trunc`）；桶按时间升序，五个级别键恒在（无数据为 0）。仅 Owner（`ManageSettings`）可访问。
      operationId: listLogStats
      parameters:
      - name: hours
        in: path
        description: 统计窗口（小时）：默认 24，范围 1–168；≤48h 按小时分桶，>48h 按天。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: 分桶统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogStatsResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 settings:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
  /api/admin/logs/tail:
    get:
      tags:
      - Admin Logs
      summary: 实时推送运行日志（SSE）
      description: '以连接时刻的最大日志 id 为锚点，每 500ms 轮询推送之后写入且匹配筛选的新日志。事件为 `event: log`、`data` 为单个日志条目（形状同 `LogItem`）；锚点查询失败时推送 `event: error` 后结束。筛选参数语义与列表接口一致（`level` 为最低级别；`target` 与 `exclude_target` 互斥，同用返回 400 `INVALID_FILTER`）。仅 Owner（`ManageSettings`）可访问。'
      operationId: tailLogs
      parameters:
      - name: level
        in: path
        description: 最低级别（同列表语义：WARN 含 WARN+ERROR）。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: target
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: exclude_target
        in: path
        description: 精确排除该 target（与 target 互斥）。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: keyword
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: request_id
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: SSE 流（持续响应，客户端断开即结束）
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LogItem'
        '400':
          description: target/exclude_target 同用等筛选参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无 settings:manage 权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookieAuth: []
