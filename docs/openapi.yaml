        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: status
        in: path
        description: 按状态筛选：`pending` / `approved` / `rejected` / `spam` / `recycled`。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: target_type
        in: path
        description: 按目标类型筛选：`article` / `page` / `link`。
