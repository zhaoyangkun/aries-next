        description: 分组设置更新体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateRequest'
        required: true
      responses:
        '200':
          description: 返回更新后的分组设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingGroupResponse'
        '400':
          description: Payload 结构不合法（INVALID_SETTING_PAYLOAD）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未认证
