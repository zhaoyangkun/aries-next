    get:
      tags:
      - Public Articles
      summary: 文章归档聚合
      description: Published 文章按 year/month 聚合，组间倒序、组内按发布时间倒序。
      operationId: listPublicArchives
      responses:
        '200':
          description: 归档分组列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchiveMonthResponse'
  /api/public/articles:
    get:
      tags:
      - Public Articles
      summary: 已发布文章分页列表
      description: 匿名可访问；只返回 `published` 状态文章。固定排序 `is_pinned DESC, sort_order ASC, published_at DESC, id DESC`，不提供排序参数。缺省分页大小取站点设置 `page_size_index`。`page > 1` 且当前页结果为空时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200），阻止爬虫沿 `?page=N` 生成无限重复 URL。
      operationId: listPublicArticles
      parameters:
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: path
        description: 缺省时取站点设置的 `page_size_index`。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: keyword
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: category_id
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: tag_id
        in: path
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: category
        in: path
        description: 按 Slug 过滤（新版统一 Slug；旧版标签按 name 的行为不继承）。
        required: true
        schema:
          type:
          - string
          - 'null'
      - name: tag
        in: path
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 返回已发布文章的分页结果；列表项不含 Markdown 原文与内部字段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticlePageResponse'
        '404':
          description: 越界分页（`PAGE_OUT_OF_RANGE`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}:
    get:
      tags:
      - Public Articles
      summary: 已发布文章公开详情
      description: '匿名可访问；Slug 不区分大小写。草稿、回收站或不存在的 Slug 一律返回 404 `ARTICLE_NOT_FOUND`。受密码保护的文章返回 `password_protected: true` 且 `rendered_html: null`，携带有效解锁 Cookie（见 access 端点）后返回正文。普通文章响应 `Cache-Control: public, max-age=60`，密码文章为 `private, no-store`。'
      operationId: getPublicArticle
      parameters:
      - name: slug
        in: path
        description: 文章 Slug（不区分大小写）
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 返回已发布文章的公开详情；不含 `markdown_source`、`author_id`、`version`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticleDetail'
        '404':
          description: 文章不存在或未发布（`ARTICLE_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}/access:
    post:
      tags:
      - Public Articles
      summary: 密码文章解锁
      description: 校验访问密码；成功后下发 HttpOnly Cookie `aries_article_access_{article_id}`（Path `/`、SameSite=Lax、2 小时），值为 HMAC-SHA256 凭据，密码修改后自动失效。同一客户端对同一文章限流 5 次/分钟。响应对所有缓存 `no-store`。
      operationId: unlockArticle
      parameters:
      - name: slug
        in: path
        description: 文章 Slug（不区分大小写）
        required: true
        schema:
          type: string
      requestBody:
        description: 访问密码
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
        required: true
      responses:
        '200':
          description: 解锁成功，`Set-Cookie` 携带访问凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockResponse'
        '400':
          description: 文章未设置访问密码（`ARTICLE_NOT_PROTECTED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 密码错误（`INVALID_ARTICLE_PASSWORD`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 文章不存在或未发布（`ARTICLE_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 解锁尝试过于频繁（5 次/分钟）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}/comments:
    get:
      tags:
      - Public Comments
      summary: 文章已批准评论树
      description: 匿名可访问；只返回已发布文章的 `approved` 评论，组织为两级树（根评论的 `children` 为回复，回复下的回复平铺在同一根下）。分页只作用于根评论，回复整组跟随所属根；根评论按创建时间升序。文章不存在或未发布返回 404；`page > 1` 且当前页无根评论时返回 404 `PAGE_OUT_OF_RANGE`（page=1 空结果保持 200）。
      operationId: listArticleComments
      parameters:
      - name: slug
        in: path
        description: 文章 Slug
        required: true
        schema:
          type: string
      - name: page
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_size
        in: path
        description: 缺省时取站点设置 `comments_per_page`。
        required: true
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: 已批准评论树分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCommentPageResponse'
        '404':
          description: 文章不存在、未发布或分页越界（PAGE_OUT_OF_RANGE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}/related:
    get:
      tags:
      - Public Articles
      summary: 相关文章推荐
      description: 以文章标题 + 摘要为查询向量，返回内容相近的其他已发布文章（默认 6 篇，最多 12 篇）。`features.smart_search` 未开启、Embedding 未配置或文章不存在时返回 404；无相近文章返回 200 空数组。
      operationId: relatedArticles
      parameters:
      - name: slug
        in: path
        description: 文章 Slug（不区分大小写）
        required: true
        schema:
          type: string
      - name: limit
        in: path
        description: 返回篇数上限（1–12，默认 6）。
        required: true
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: 相关文章列表（可能为空数组）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedArticleResponse'
        '404':
          description: 文章不存在或 AI 检索未开启（`ARTICLE_NOT_FOUND` / `AI_RETRIEVAL_DISABLED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/public/articles/{slug}/views:
    post:
