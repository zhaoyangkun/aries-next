          format: int64
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }
        level_counts:
          description: 最近 24 小时各级别条数，与筛选条件无关。
          type: object
          required: [ERROR, WARN, INFO, DEBUG, TRACE]
          properties:
            ERROR: { type: integer, format: int64 }
            WARN: { type: integer, format: int64 }
            INFO: { type: integer, format: int64 }
            DEBUG: { type: integer, format: int64 }
            TRACE: { type: integer, format: int64 }
