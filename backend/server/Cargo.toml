[package]
name = "aries-server"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
# 包内现有 aries-server 与 openapi-export 两个 bin：默认运行主服务，
# 导出工具显式 --bin openapi-export 调用。
default-run = "aries-server"

[dependencies]
anyhow.workspace = true
aries-core = { path = "../core" }
aries-infra = { path = "../infra" }
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
cookie.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
include_dir.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
time.workspace = true
# sync：log channel 的 mpsc 与优雅退出信号的 watch（此前靠 aries-core 的 feature 统一隐式获得）。
tokio = { workspace = true, features = ["sync"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# time：DTO 中的 OffsetDateTime；uuid：Session 等 DTO 的 Uuid 字段
utoipa = { version = "5", features = ["yaml", "time", "uuid"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# 媒体缩略图 contract 测试：构造测试图片并解码响应断言尺寸。
image.workspace = true
# start_paused 异步测试（日志覆盖自动复位的时间推进）。
tokio = { workspace = true, features = ["test-util"] }
